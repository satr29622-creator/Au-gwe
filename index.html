<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockscreen AU Interaktif</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url('https://unsplash.com') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }
        .hint-section {
            margin-top: 40px;
        }
        .hint-title {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .hint-text {
            font-size: 13px;
            color: #d1d1d6;
            line-height: 1.4;
            padding: 0 10px;
        }
        .dots-container {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }
        .dot {
            width: 12px;
            height: 12px;
            border: 1.5px solid white;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .dot.active {
            background-color: white;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 25px;
            margin-bottom: 40px;
        }
        .key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 0.1s;
        }
        .key:active {
            background-color: rgba(255, 255, 255, 0.4);
        }
        .key span {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: -2px;
            color: rgba(255, 255, 255, 0.6);
        }
        .footer-action {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 16px;
            color: white;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Bagian Petunjuk / Kisi-kisi -->
        <div class="hint-section">
            <div class="hint-title">Masukkan Kata Sandi</div>
            <div class="hint-text">
                Petunjuk: Berapa jumlah member LNGSHOT dikali angka keberuntungan Ryul? <br>
                <strong>JANGAN SEBARKAN PASSCODE.</strong>
            </div>
            
            <!-- Titik Passcode -->
            <div style="display: flex; justify-content: center;">
                <div class="dots-container">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- Tombol Angka -->
        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2<span>ABC</span></button>
            <button class="key" onclick="pressKey('3')">3<span>DEF</span></button>
            <button class="key" onclick="pressKey('4')">4<span>GHI</span></button>
            <button class="key" onclick="pressKey('5')">5<span>JKL</span></button>
            <button class="key" onclick="pressKey('6')">6<span>MNO</span></button>
            <button class="key" onclick="pressKey('7')">7<span>PQRS</span></button>
            <button class="key" onclick="pressKey('8')">8<span>TUV</span></button>
            <button class="key" onclick="pressKey('9')">9<span>WXYZ</span></button>
            <div style="visibility: hidden;"></div>
            <button class="key" onclick="pressKey('0')">0</button>
        </div>

        <!-- Bagian Bawah -->
        <div class="footer-action">
            <div>Darurat</div>
            <div onclick="resetPasscode()" style="cursor: pointer;">Batal</div>
        </div>
    </div>

    <script>
        // KODE PIN YANG BENAR (Silakan ganti sesuai keinginan)
        const CORRECT_PIN = "1234"; 
        
        // LINK TUJUAN SETELAH PIN BENAR (Ganti dengan link cerita kelanjutannya)
        const TARGET_URL = "https://x.com"; 

        let currentInput = "";
        const dots = document.querySelectorAll('.dot');

        function pressKey(num) {
            if (currentInput.length < 4) {
                currentInput += num;
                updateDots();
                
                if (currentInput.length === 4) {
                    // Cek jawaban setelah 4 digit terisi
                    setTimeout(checkPin, 200);
                }
            }
        }

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentInput.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function resetPasscode() {
            currentInput = "";
            updateDots();
        }

        function checkPin() {
            if (currentInput === CORRECT_PIN) {
                alert("Passcode Benar! Membuka halaman rahasia...");
                window.location.href = TARGET_URL;
            } else {
                alert("Passcode Salah! Silakan coba lagi.");
                resetPasscode();
            }
        }
    </script>
</body>
</html>
